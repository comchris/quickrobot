[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickrobot"
version = "0.10"
description = "LAN controller for llama.cpp cluster deployment"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.1",
    "waitress==3.0.2",
    "flask-cors==5.0.0",
    "Flask-SocketIO==5.5.1",
    "psutil==7.0.0",
    "requests==2.32.3",
    "requests_ntlm==1.3.0",
    "PyYAML==6.0.2",
    "ansible==12.0.0",
    "ansible-core==2.19.4",
    "Jinja2==3.1.6",
    "MarkupSafe==2.1.5",
]

[project.scripts]
quickrobot = "quickrobot:main"

[tool.setuptools.packages.find]
include = ["qr_api*", "engine*", "lib*", "db*"]
exclude = ["tests*", "data*", "playbooks*", "webui*", "prompts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "requests>=2.32",
]
