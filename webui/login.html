<!-- Single-user password login for WebUI -->
{% import 'base.html' as base %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quickrobot — Login</title>
<style>
  :root {
    --bg-body: #f5f5f5; --bg-card: #fff; --bg-nav: #1a1a2e;
    --fg-body: #333; --fg-muted: #666; --fg-heading: #1a1a2e;
    --accent: #4fc3f7; --border: #ddd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         display: flex; justify-content: center; align-items: center;
         min-height: 100vh; background: var(--bg-body); color: var(--fg-body); }
  .login-box {
    max-width: 360px; width: 90%;
    padding: 32px; background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px; text-align: center;
  }
  .login-box h1 { font-size: 1.4em; margin-bottom: 6px; color: var(--fg-heading); }
  .login-box p.subtitle { color: var(--fg-muted); font-size: 0.85em; margin-bottom: 20px; }
  .login-box input[type="password"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 4px; font-size: 1em; margin-bottom: 12px;
  }
  .login-box input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 10px; background: var(--accent); color: #fff;
    border: none; border-radius: 4px; font-size: 1em; cursor: pointer;
  }
  .login-box button:hover { opacity: 0.9; }
  .error { color: #e53935; margin-bottom: 12px; font-size: 0.9em; }
</style>
</head>
<body>
<div class="login-box">
  <h1>Quickrobot</h1>
  <p class="subtitle">LAN Controller Web UI</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/webui/login">
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
