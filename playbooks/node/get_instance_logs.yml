# @name: Get Instance Logs
# @playbook_id: get_instance_logs
# @version: 2
# @timeout: 30
# get_instance_logs.yml — Fetch systemd journal logs for a quickrobot instance
# Uses extra_vars: target_host, log_instance_id, log_engine_type, log_lines
- hosts: "{{ target_host }}"
  gather_facts: no
  become: yes

  vars:
    unit_name: "qr-{{ log_instance_id }}-{{ log_engine_type }}"

  tasks:
    - name: Get journal logs
      ansible.builtin.command: "journalctl -u {{ unit_name }} --utc --no-pager -n {{ log_lines }}"
      register: _journal_output
      changed_when: false
      failed_when: false

    - name: Output logs
      ansible.builtin.debug:
        msg: "{{ _journal_output.stdout }}"
