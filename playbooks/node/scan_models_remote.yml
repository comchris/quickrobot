# @name: Scan Models Remote
# @playbook_id: scan_models_remote
# @version: 4
# @timeout: 600
# scan_models_remote.yml — Scan remote nodes for GGUF model files
# Outputs JSONL lines per host: {"host": ..., "models_raw": [...]}
# Required vars: model_root_path (must be provided, no default)
# v3: Fixed mmproj detection — case-insensitive filter, wider glob patterns
# v4: Fixed mmproj detection — aggressive quant suffix stripping + directory scan fallback

- hosts: all
  gather_facts: no

  vars:
    model_root_path: "{{ model_root_path }}"

  pre_tasks:
    - name: Ensure model root path exists
      ansible.builtin.stat:
        path: "{{ model_root_path }}"
      register: _model_root_check

    - name: Fail if model root missing on host
      ansible.builtin.fail:
        msg: "Model root {{ model_root_path }} not found on {{ inventory_hostname }}"
      when: not _model_root_check.stat.exists

  tasks:
    - name: Find GGUF models with metadata via shell
      ansible.builtin.shell: >
        find {{ model_root_path }}
        -name '*.gguf' -type f 2>/dev/null | grep -vi mmproj | while read f; do
          sz=$(stat -c '%s' "$f" 2>/dev/null || echo "0")
          dir=$(dirname "$f")
          base=$(basename "$f" .gguf)
          mmproj_path=""

          # Strategy 1: Exact match on base name (rare but simplest)
          if [ -f "${dir}/${base}.mmproj" ]; then
            mmproj_path="${dir}/${base}.mmproj"
          elif [ -f "${dir}/${base}_mmproj.gguf" ]; then
            mmproj_path="${dir}/${base}_mmproj.gguf"
          else
            # Strategy 2: Strip quant suffix and try patterns with clean name
            # This handles: Q4_K_M, Q8_0, F16, BF16, MTP, UD, etc. at the end
            clean_base=$(echo "$base" | sed -E 's/(-[Qq][0-9]+[_0-9A-Z]*|-bf?16|-f32|-bf?16|-F32|-BF16)$//i' | sed -E 's/(-MTP|-UD|-mtp|-ud)$//i')

            # Strategy 2a: Try patterns with the clean base name
            for pattern in \
              "${dir}/${clean_base}-mmproj*.gguf" \
              "${dir}/${clean_base}_mmproj*.gguf" \
              "${dir}/mmproj-${clean_base}*.gguf" \
              "${dir}/${clean_base}-*.mmproj" \
              "${dir}/${clean_base}_*.mmproj" \
              "${dir}/mmproj-${clean_base}*" \
              "${dir}/${clean_base}*mmproj*"; do
              if [ -f "$pattern" ]; then
                mmproj_path="$pattern"
                break
              fi
            done

            # Strategy 3: Directory scan fallback — find any mmproj in the same dir
            # Handles files like "mmproj-F32.gguf", "mmproj-step3.7-flash-f16.gguf"
            if [ -z "$mmproj_path" ]; then
              for mf in "${dir}"/mmproj*.gguf "${dir}"/*-mmproj*.gguf "${dir}"/*_mmproj*.gguf; do
                if [ -f "$mf" ] && echo "$mf" | grep -qv "$(basename "$f")"; then
                  mmproj_path="$mf"
                  break
                fi
              done
            fi

            # Strategy 4: Broader dir scan — any file with "mmproj" in name, excluding current model
            if [ -z "$mmproj_path" ]; then
              for mf in "${dir}"/*; do
                if [ -f "$mf" ] && echo "$(basename "$mf")" | grep -qi mmproj && [ "$(basename "$mf")" != "$(basename "$f")" ]; then
                  mmproj_path="$mf"
                  break
                fi
              done
            fi
          fi
          mt=$(stat -c '%Y' "$f" 2>/dev/null || echo "0")
          printf '{"path":"%s","size":%s,"mmproj_path":"%s","last_modified_epoch":%s}\n' "$f" "$sz" "$mmproj_path" "$mt"
        done
      register: _find_output
      changed_when: false

    - name: Collect model results per host
      ansible.builtin.set_fact:
        _models_jsonl: "{{ _find_output.stdout_lines | select('search', '^.*') | list }}"
        _scan_result_host: "{{ inventory_hostname }}"

    - name: Output model list per host
      ansible.builtin.debug:
        msg: "{{ { 'host': _scan_result_host, 'models_raw': _models_jsonl } }}"
      changed_when: false
