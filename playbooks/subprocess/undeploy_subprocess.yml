# @name: Undeploy Subprocess Instance
# @playbook_id: undeploy_subprocess
# @version: 1
# Removes subprocess instance files, leaves shared template cache intact
# Variables required: inventory_host, unit_name, instance_id
- hosts: "{{ inventory_host | default('localhost') }}"
  become: yes
  gather_facts: no
  vars:
    unit_name: "qr-{{ instance_id }}-{{ engine_type }}"
    _pkill_pattern: "{{ pkill_pattern | default('node_exporter') }}"

  tasks:
    - import_tasks: "{{ playbook_dir }}/common/undeploy_base.yml"
