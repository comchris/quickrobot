# @name: Reboot Node
# @playbook_id: reboot_node
# @version: 3
# @timeout: 600
# reboot_node.yml — Async fire-and-forget reboot of a remote node
# NOTE: become: yes required — sudoers.d not yet active on target nodes.
#       ansible.builtin.reboot does NOT support async (v2 bug), so we use
#       shell with /sbin/shutdown -r +0 & and async/poll:0 to fire-and-forget.
- hosts: "{{ inventory_host }}"
  become: yes
  gather_facts: no
  tasks:
    - name: Fire shutdown command (async fire-and-forget)
      ansible.builtin.shell: /sbin/shutdown -r +0 &
      async: 10
      poll: 0
