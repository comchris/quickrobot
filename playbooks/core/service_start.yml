# @name: Start Service
# @playbook_id: service_start
# @version: 3
# @timeout: 120
# start.yml — Stop, start, and verify service is running.
# Different health check strategy per engine type:
# - llama_server: HTTP /health endpoint (waits for model load to complete)
# - llama_rpc: Port binding + systemd check (no model loading)
# References:
#   PR #9056: https://github.com/ggml-org/llama.cpp/pull/9056 (merged Aug 2024)
#   Issue #9291: https://github.com/ggml-org/llama.cpp/issues/9291 (API changelog)
- hosts: "{{ inventory_host }}"
  become: yes
  gather_facts: no

  vars:
    unit_name: "qr-{{ instance_id }}-{{ engine_type }}"
    _rpc_delay: 10
    _server_timeout: 300
    _server_retries: 6
    _server_delay: 5

  tasks:
    - name: Stop service (ensure clean state)
      systemd:
        name: "{{ unit_name }}"
        state: stopped
        daemon_reload: yes
      ignore_errors: yes

    - name: Set service boot state (start_on_boot)
      systemd:
        name: "{{ unit_name }}"
        enabled: "{{ (start_on_boot is defined and start_on_boot) | bool }}"

    - name: Start service
      systemd:
        name: "{{ unit_name }}"
        state: started
        daemon_reload: yes



    - name: Verify service is still running (not crashed)
      command: systemctl is-active "{{ unit_name }}"
      register: _svc_active
      changed_when: false

    - name: Fail if service died within initial check period
      fail:
        msg: "Service {{ unit_name }} started but died — check logs (journalctl -u {{ unit_name }})"
      when: _svc_active.stdout != "active"

    - name: Report start status
      debug:
        msg: "start — unit={{ unit_name }}, boot={{ start_on_boot | default(false) }}, health=systemd-active"
